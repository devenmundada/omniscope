name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build (no secrets)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
